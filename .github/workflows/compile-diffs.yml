# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Compile diffs
run-name: "Compile and compare ${{ github.actor }}'s changes"
on:
  pull_request:
    branches:
      - main

jobs:
  compile-diffs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15.1"
      - name: Install typdiff
        run: |
          curl -fsSL \
            https://github.com/sou1118/typdiff/releases/download/v0.1.4/typdiff-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Download fonts
        run: |
          git clone --depth 1 https://github.com/Dsek-LTH/dsek-typst ../dsek-typst
      - name: Compile documents and diffs
        run: |
          mkdir build
          for filename in stadgar.typ reglemente.typ strategiska-mål.typ policyer/*.typ riktlinjer/*.typ; do
              name="$(basename "${filename%.typ}")"
              if [ ! -f "main/$filename" ]; then
                  # Document is new in this pull request; no diff possible
                  typst compile --root . --font-path ../dsek-typst/fonts \
                      "$filename" "build/$name.pdf"
                  continue
              fi
              if ! cmp -s "main/$filename" "$filename"; then
                  typst compile --root . --font-path ../dsek-typst/fonts \
                      "$filename" "build/$name.pdf"
                  typdiff "main/$filename" "$filename" -o "build/${name}_diff.typ"
                  typst compile --root . --font-path ../dsek-typst/fonts \
                      "build/${name}_diff.typ" "build/${name}_diff.pdf"
              fi
          done
      - name: List outputs
        run: ls build
      - name: Upload PDFs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-pdfs
          path: build/*.pdf

      - name: Update PR comment with artifact links
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- typst-artifacts -->';

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const runId = context.runId;

            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;

            const body = `${marker}
            ### 📄 Compiled Typst Documents

            The latest PDFs for this pull request have been generated automatically.

            **Available artifacts:**
            - ✅ PR version PDFs
            - 🔄 typdiff PDFs vs \`main\`

            👉 **Download here:**
            ${runUrl}
            (Scroll to the **Artifacts** section on that page.)

            _Last updated: ${new Date().toISOString()}_
            `;

            // Fetch existing comments on the PR
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });

            // Look for an existing comment with our marker
            const existing = comments.data.find(
              comment => comment.body && comment.body.includes(marker)
            );

            if (existing) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
