# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Compile PDFs
run-name: "Recompile after ${{ github.actor }}'s changes"
on:
  push:
    branches:
      - main

jobs:
  compile-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out document sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: '0.15.1'
      - name: Download fonts
        run: |
          git clone --depth 1 https://github.com/Dsek-LTH/dsek-typst ../dsek-typst
      - name: Compile documents
        run: |
          mkdir build
          for filename in stadgar.typ reglemente.typ strategiska-mål.typ policyer/*.typ riktlinjer/*.typ; do
              typst compile --root . --font-path ../dsek-typst/fonts \
                  "$filename" "build/$(basename "${filename%.typ}").pdf"
          done
      - name: List outputs
        run: ls build
      - name: Create release
        if: ${{ github.ref_name == 'main' }}
        run: |
          gh release delete latest -y
          gh release create latest build/*.pdf
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
